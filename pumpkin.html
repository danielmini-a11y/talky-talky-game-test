<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>토키토키 · 호박농장</title><style>
*{box-sizing:border-box}body{margin:0;color:#fff6e2;font-family:system-ui,sans-serif;background:#170f24}main{max-width:650px;margin:auto;padding:12px}header,.hud{display:flex;justify-content:space-between;align-items:center;gap:9px}h1{font-size:clamp(21px,5vw,30px)}a{color:#ffda8b}.hud{background:#30203b;padding:12px;border-radius:15px;font-weight:800}button{border:0;border-radius:15px;padding:12px 18px;font-size:17px;font-weight:800;cursor:pointer}#sound{background:#49325c;color:white}#field{position:relative;overflow:hidden;border:4px solid #9e7143;border-radius:23px;margin-top:12px;padding:18px 8px 22px;background:radial-gradient(ellipse at 50% 7%,#a88d5680,transparent 55%),linear-gradient(#302b45a8,#291c25bb),repeating-linear-gradient(105deg,#61432b 0 35px,#422d25 35px 72px);box-shadow:inset 0 0 65px #ffcc7d30,0 8px 25px #0007}#field:before{content:"🌙 ✨  🌲  🏚️  🌲 ✨";display:block;text-align:center;font-size:30px;margin:4px 0 12px;text-shadow:0 0 18px #ffe1a0}#board{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;touch-action:none;user-select:none}.cell{aspect-ratio:1;background:#140c1885;border:1px solid #ffd78b40;border-radius:12px;display:grid;place-items:center;font-size:clamp(26px,7vw,44px);padding:0;transition:transform .15s,filter .15s;text-shadow:0 5px 8px #0008;box-shadow:inset 0 -5px 8px #0004}.cell.selected{outline:3px solid #fff4b3;transform:scale(1.1);z-index:1}.cell.pop{animation:pop .28s ease-out}.cell.glow{box-shadow:0 0 18px #fff4a8,inset 0 0 15px #ffdc84}.cell:active{transform:scale(.92)}@keyframes pop{50%{transform:scale(1.4);filter:brightness(2.2)}100%{transform:scale(0);opacity:.1}}#toast{height:43px;text-align:center;font-size:22px;font-weight:900;color:#ffedaf;text-shadow:0 0 12px #ff9f3c}#sparkles{position:absolute;inset:0;pointer-events:none;overflow:hidden}.spark{position:absolute;animation:burst .75s ease-out forwards;font-size:25px;text-shadow:0 0 14px #fff}@keyframes burst{from{opacity:1;transform:translate(0,0) scale(.4)}to{opacity:0;transform:translate(var(--x),var(--y)) scale(1.8)}}#intro{position:fixed;inset:0;z-index:10;background:linear-gradient(#100a18c4,#1e1020ed);display:grid;place-items:center;padding:18px}#intro[hidden]{display:none}.intro-card{max-width:560px;border:3px solid #dca86c;border-radius:26px;padding:24px 18px;text-align:center;background:radial-gradient(circle at 50% 0%,#866345,#342039 75%);box-shadow:0 0 65px #f6c47744}.npc{font-size:90px;filter:drop-shadow(0 13px 5px #110915);margin:8px}.talk{border:2px solid #eac69b;background:#fff7e9;color:#34233c;border-radius:20px;padding:16px;line-height:1.65;font-size:18px}.start{background:linear-gradient(#ffda7d,#e99335);color:#40212e;width:90%;margin:18px auto 0;box-shadow:0 5px 18px #f6ab5290}#hint{text-align:center;color:#f6d8ad;font-size:14px;line-height:1.5}#finish{display:none;position:fixed;inset:0;z-index:9;align-items:center;justify-content:center;background:#120b22cc;text-align:center;padding:20px}#finish.show{display:flex}#finish .intro-card{width:100%}
</style></head><body><main><header><h1>🎃 마법의 호박농장</h1><a href="./index.html">미션 선택</a></header><div class="hud"><span id="score">⭐ 0점</span><span id="goal">🎃 0 / 45</span><button id="sound">🔊 소리 켜짐</button></div><section id="field"><div id="toast">호박을 세 개 이상 연결하세요!</div><div id="board"></div><div id="sparkles"></div></section><p id="hint">호박을 하나 선택하고 이웃한 호박을 선택하거나 밀어서 자리를 바꾸세요. 3개 이상 나란히 맞추면 수확합니다.</p></main>
<div id="intro"><div class="intro-card"><h2>🌙 달빛 아래 호박농장</h2><div class="npc">👩‍🌾</div><div class="talk"><strong>호박농장 관리인</strong><p>어서 와! 마법에 걸린 호박들이 농장을 가득 채웠어. 같은 호박을 3개 이상 연결해 수확해 줘! 4개, 5개를 연결하면 더 멋진 마법이 펼쳐질 거야.</p></div><button class="start" id="start">🎃 호박 수확 시작!</button></div></div>
<div id="finish"><div class="intro-card"><h2>✨ 호박농장 클리어! ✨</h2><div class="npc">👩‍🌾</div><div class="talk">정말 고마워! 네 덕분에 호박농장이 다시 평화로워졌어. 멋진 수확이었어!</div><button class="start" id="again">다시 도전하기</button><p><a href="./index.html">미션 선택으로 돌아가기</a></p></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),N=7,types=['🎃','🍂','🌽','🍄','🍎','🌻'],board=$('board');let cells=[],grid=[],selected=null,locked=false,score=0,harvest=0,muted=false,ctx=null,musicTimer=null,chain=0,active=false;const rand=()=>Math.floor(Math.random()*types.length);
function audio(){try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();if(ctx.state==='suspended')ctx.resume()}catch(e){}}
function tone(freq,when,dur=.2,wave='sine',vol=.085){if(muted||!ctx)return;let o=ctx.createOscillator(),g=ctx.createGain();o.type=wave;o.frequency.setValueAtTime(freq,when);g.gain.setValueAtTime(.0001,when);g.gain.exponentialRampToValueAtTime(vol,when+.018);g.gain.exponentialRampToValueAtTime(.0001,when+dur);o.connect(g).connect(ctx.destination);o.start(when);o.stop(when+dur+.02)}
function matchSound(n,offset=0){audio();if(!ctx)return;const t=ctx.currentTime+offset;let notes=n>=5?[659,880,1047,1319]:n===4?[523,659,880]:[392,523];notes.forEach((f,i)=>tone(f,t+i*.085,n>=5?.43:.26,n>=5?'triangle':'sine',n>=5?.12:.075));if(n>=5)tone(1760,t+.27,.55,'sine',.065)}
function music(){if(!active||muted)return;audio();if(!ctx)return;const t=ctx.currentTime;[220,261.63,329.63,293.66,261.63,196].forEach((f,i)=>tone(f,t+i*.43,.36,'sine',.016))}
function startMusic(){clearInterval(musicTimer);music();musicTimer=setInterval(music,2800)}
function swap(a,b){const t=grid[a];grid[a]=grid[b];grid[b]=t}
function groups(){let found=[];for(let r=0;r<N;r++){let c=0;while(c<N){let end=c+1;while(end<N&&grid[r*N+end]===grid[r*N+c])end++;if(end-c>=3)found.push(Array.from({length:end-c},(_,i)=>r*N+c+i));c=end}}for(let c=0;c<N;c++){let r=0;while(r<N){let end=r+1;while(end<N&&grid[end*N+c]===grid[r*N+c])end++;if(end-r>=3)found.push(Array.from({length:end-r},(_,i)=>(r+i)*N+c));r=end}}return found}
function render(){cells.forEach((b,i)=>{b.textContent=grid[i]===null?'':types[grid[i]];b.classList.toggle('selected',i===selected)});$('score').textContent='⭐ '+score+'점';$('goal').textContent='🎃 '+harvest+' / 45'}
function init(){grid=Array.from({length:N*N},rand);let tries=0;while(groups().length&&tries++<100){for(let i=0;i<grid.length;i++)grid[i]=rand()}score=0;harvest=0;selected=null;locked=false;chain=0;render()}
function particles(ids,n){const root=$('sparkles'),rect=board.getBoundingClientRect();ids.forEach(i=>{const r=cells[i].getBoundingClientRect();for(let k=0;k<(n>=5?5:3);k++){const s=document.createElement('span');s.className='spark';s.textContent=n>=5?'✨':n===4?'⭐':'✦';s.style.left=(r.left-rect.left+r.width/2+board.offsetLeft)+'px';s.style.top=(r.top-rect.top+r.height/2+board.offsetTop)+'px';s.style.setProperty('--x',(Math.random()*130-65)+'px');s.style.setProperty('--y',(Math.random()*130-65)+'px');root.appendChild(s);setTimeout(()=>s.remove(),780)}})}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function resolve(){locked=true;chain=0;while(true){const found=groups();if(!found.length)break;chain++;const unique=[...new Set(found.flat())];found.forEach((g,i)=>matchSound(g.length,i*.018));const best=Math.max(...found.map(g=>g.length));$('toast').textContent=best>=5?'🌟 환상적인 수확!':best===4?'✨ 멋진 수확!':'🎃 수확 성공!';if(chain>1)$('toast').textContent+=' '+chain+'연쇄!';particles(unique,best);unique.forEach(i=>cells[i].classList.add('pop','glow'));score+=unique.length*10*chain;harvest+=unique.length;render();await sleep(350);for(const i of unique)grid[i]=null;for(let c=0;c<N;c++){let vals=[];for(let r=N-1;r>=0;r--)if(grid[r*N+c]!==null)vals.push(grid[r*N+c]);while(vals.length<N)vals.push(rand());for(let r=N-1,k=0;r>=0;r--,k++)grid[r*N+c]=vals[k]}cells.forEach(b=>b.classList.remove('pop','glow'));render();await sleep(250)}locked=false;if(harvest>=45){active=false;clearInterval(musicTimer);$('finish').classList.add('show');audio();if(ctx)[523,659,784,1047,1319].forEach((f,i)=>tone(f,ctx.currentTime+i*.17,.55,'triangle',.1))}else if(!possible()){init();$('toast').textContent='새로운 호박들이 나타났어!'}}
function possible(){for(let i=0;i<N*N;i++){for(const j of [i+1,i+N]){if(j>=N*N||(j===i+1&&i%N===N-1))continue;swap(i,j);let yes=groups().length>0;swap(i,j);if(yes)return true}}return false}
async function pick(i){if(locked||!active)return;if(selected===null){selected=i;render();return}if(i===selected){selected=null;render();return}let a=selected;selected=null;if(Math.abs(Math.floor(a/N)-Math.floor(i/N))+Math.abs(a%N-i%N)!==1){selected=i;render();return}swap(a,i);render();if(groups().length)await resolve();else{locked=true;audio();if(ctx)tone(185,ctx.currentTime,.16,'triangle',.045);await sleep(220);swap(a,i);locked=false;render()}}
let down=null;for(let i=0;i<N*N;i++){const b=document.createElement('button');b.className='cell';b.setAttribute('aria-label','호박 칸 '+(i+1));b.addEventListener('pointerdown',e=>{down={i,x:e.clientX,y:e.clientY}});b.addEventListener('pointerup',e=>{if(!down)return;const dx=e.clientX-down.x,dy=e.clientY-down.y;if(Math.max(Math.abs(dx),Math.abs(dy))>22){const target=Math.abs(dx)>Math.abs(dy)?i+(dx>0?1:-1):i+(dy>0?N:-N);if(target>=0&&target<N*N&&!(Math.abs(dx)>Math.abs(dy)&&Math.floor(target/N)!==Math.floor(i/N))){selected=i;pick(target)}else pick(i)}else pick(i);down=null});board.appendChild(b);cells.push(b)}
$('start').onclick=()=>{audio();active=true;init();$('intro').hidden=true;startMusic()};$('again').onclick=()=>{audio();active=true;$('finish').classList.remove('show');init();startMusic()};$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐';if(!muted){audio();startMusic()}else clearInterval(musicTimer)};init();
})();
</script></body></html>
