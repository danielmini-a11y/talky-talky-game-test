<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토키토키 할로윈 · 도서관</title><style>*{box-sizing:border-box}body{margin:0;background:#15142e;color:#fff;font-family:system-ui,sans-serif}main{max-width:750px;margin:auto;padding:14px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}a,button{background:#ffd27b;color:#322345;border:0;border-radius:13px;padding:13px;font-size:16px;font-weight:800;text-decoration:none;cursor:pointer}.scene{position:relative;min-height:450px;border:3px solid #b78c55;border-radius:22px;margin:14px 0;overflow:hidden;background:radial-gradient(ellipse at 50% 10%,#665076,#302445 50%,#191a2b)}.scene:before{content:'🕯️';position:absolute;top:15px;left:46%;font-size:60px}.shelves{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:100px 12px 35px}.shelf{background:linear-gradient(90deg,#58351f,#9e663b,#57351f);border:5px solid #b67d47;border-radius:10px;min-height:230px;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:20px}.shelf button{background:#f9e3a8;min-width:80%;min-height:75px}.message{padding:16px;background:#302849;border-radius:14px;line-height:1.6}.overlay{position:fixed;inset:0;background:#0a0927e9;display:flex;justify-content:center;align-items:center;padding:15px;z-index:10}.overlay[hidden]{display:none}.panel{background:#fff1d5;color:#30243d;border:4px solid #c79b61;border-radius:24px;padding:24px;width:min(100%,530px);max-height:90dvh;overflow:auto;text-align:center}.choices{display:grid;gap:10px;margin:18px 0}.choices button{min-height:54px}.muted{opacity:.65}.panel p{line-height:1.6}.next{background:#7b579b;color:white;width:100%}#result{font-weight:800;min-height:24px}#progress{font-weight:800;color:#ffdb9b}@media(max-width:430px){.shelves{gap:6px;padding:90px 6px 25px}.shelf{min-height:215px}.shelf button{padding:8px 3px;font-size:13px;min-width:90%}.scene{min-height:380px}}</style></head><body><main><header><strong>📚 토키토키 할로윈 · 마을 도서관</strong><a href="./index.html">↩ 마을로</a></header><p id="progress">영어 단서 0 / 3</p><div class="scene"><div class="shelves"><div class="shelf">📖<button data-book="0">오래된 일기</button></div><div class="shelf">🗝️<button data-book="1">비밀 기록</button></div><div class="shelf">👻<button data-book="2">유령의 전설</button></div></div></div><p class="message" id="message">📚 사서: 어서 와! 제재소에서 발견한 단서가 이 도서관의 오래된 기록과 관련이 있어. 책 세 권을 조사해 유령의 비밀을 찾아보자.</p><div class="overlay" id="dialog"><div class="panel"><h2 id="heading">📚 도서관에 온 것을 환영해!</h2><p id="story">제재소에서 발전기를 복구한 뒤, 마을 도서관에서 오래된 기록을 조사하게 되었어요. 책장을 눌러 영어 단서를 해독하세요.</p><button id="listen" hidden>🔊 영어 듣기</button><div class="choices" id="choices"></div><p id="result"></p><button class="next" id="close">▶ 조사 시작</button></div></div></main><script>(function(){const data=[{name:'오래된 일기',text:'I saw a ghost last night.',prompt:'영어 문장을 듣고 알맞은 뜻을 고르세요.',answers:['어젯밤 유령을 보았어요.','오늘 아침 학교에 갔어요.','나는 책을 샀어요.'],correct:0,clue:'일기에는 어젯밤 유령을 보았다는 기록이 있어요.'},{name:'비밀 기록',text:'The key is under the table.',prompt:'비밀 기록을 듣고 열쇠가 어디에 있는지 고르세요.',answers:['창문 옆','탁자 아래','문 뒤'],correct:1,clue:'누군가 열쇠를 탁자 아래에 숨겼다는 기록을 찾았어요.'},{name:'유령의 전설',text:'The ghost wants to go home.',prompt:'유령이 무엇을 원하는지 고르세요.',answers:['친구와 놀기','나무를 자르기','집으로 돌아가기'],correct:2,clue:'유령은 사람들을 해치려는 것이 아니라 집으로 돌아가고 싶어 해요.'}];const done=new Set();let active=-1;const $=id=>document.getElementById(id),dialog=$('dialog');function say(){if(active<0)return;try{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(data[active].text);u.lang='en-US';u.rate=.83;speechSynthesis.speak(u)}catch(e){$('result').textContent='음성 기능을 사용할 수 없습니다. 문장을 읽어 주세요.'}}function open(i){active=i;let d=data[i];$('heading').textContent='📖 '+d.name;$('story').textContent=d.prompt;$('listen').hidden=false;$('choices').replaceChildren();$('result').textContent='';$('close').hidden=true;d.answers.forEach((a,n)=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(n!==d.correct){$('result').textContent='다시 도전해 보세요! 영어를 다시 들어 보세요.';return}done.add(i);try{localStorage.setItem('tokitoki-library-clue-'+(i+1),'solved')}catch(e){}$('result').textContent='🎉 정답! '+d.clue;$('message').textContent=d.clue;$('progress').textContent='영어 단서 '+done.size+' / 3';$('choices').querySelectorAll('button').forEach(x=>x.disabled=true);$('close').hidden=false;$('close').textContent=done.size===3?'▶ 조사 완료':'▶ 책장으로 돌아가기';if(done.size===3){try{localStorage.setItem('tokitoki-halloween-clue-library','complete')}catch(e){}}};$('choices').appendChild(b)});dialog.hidden=false;say()}document.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>open(Number(b.dataset.book)));$('listen').onclick=say;$('close').onclick=()=>{dialog.hidden=true;active=-1;if(done.size===3){$('message').textContent='🎉 도서관 조사 완료! 유령은 집으로 돌아가고 싶어 해요. 다음 장소에서 비밀을 더 밝혀 보세요.'}};})();</script></body></html>
