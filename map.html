<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토키토키 · 할로윈 마을 지도</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#584268,#171322 72%);font-family:system-ui,sans-serif;color:#ffebc8}.wrap{max-width:640px;margin:auto;padding:22px 16px 55px}header{text-align:center}h1{font-size:27px;margin:9px 0;color:#ffda94}header p{font-size:14px;color:#d8c2cb;line-height:1.7}.route{position:relative;padding:10px 0}.step{display:flex;align-items:center;gap:15px;margin:14px 0;background:linear-gradient(115deg,#45314e,#2c223b);border:1px solid #c8a06d;border-radius:17px;padding:15px;text-decoration:none;color:#ffedcd;box-shadow:0 6px 22px #0004}.step .emoji{font-size:36px;width:52px;text-align:center}.step strong{display:block;font-size:17px}.step small{display:block;color:#d9c1b2;margin-top:5px}.step .arrow{margin-left:auto;color:#ffcd81;font-size:23px}.done{border-color:#6cbb90}.done small{color:#9ce9b8}.locked{opacity:.55}.actions{display:flex;gap:10px;margin-top:20px}.actions a,.actions button{flex:1;background:#5c4161;color:#fff0d5;border:1px solid #bba07a;border-radius:12px;padding:13px;text-align:center;text-decoration:none;font-size:14px}.finish{display:none;text-align:center;padding:24px;border:2px solid #e3b768;border-radius:18px;background:#503453;margin:15px 0}.finish h2{color:#ffe1a0}.name{color:#ffd895}</style></head><body><main class="wrap"><header><div style="font-size:54px">🌕🏘️🎃</div><h1>할로윈 마을 모험 지도</h1><p id="welcome">순서대로 미션을 해결하며 마을의 비밀을 밝혀 보세요.</p></header><div class="finish" id="finish"><div style="font-size:54px">🏆</div><h2>마을의 모든 비밀을 밝혔어요!</h2><p>Wonderful! 모든 퀘스트를 완료했습니다.</p></div><div class="route" id="route"></div><div class="actions"><a href="./index.html">🚪 마을 입구</a><button id="restart">처음부터 다시 하기</button></div><p style="font-size:12px;text-align:center;color:#beaebe">진행 상황은 이 기기의 브라우저에 저장됩니다. 다른 기기에서는 이어지지 않습니다.</p></main><script>
const stages=[['sawmill','🏭','유령 제재소','발전기 3대 복구','sawmill.html'],['library','📚','마법 도서관','날아다니는 책 봉인','library.html'],['chapel','⛪','오래된 예배당','거미줄을 물리치고 역사 조사','chapel.html'],['pumpkin','🎃','마법의 호박농장','호박 수확과 역사 미션','pumpkin-original.html'],['costume','🎭','코스튬 숍','숨은 물건과 영어 퀴즈','costume-find.html'],['square','🏘️','마을 광장','마지막 단서 조사','square.html']];
const p=new URLSearchParams(location.search),route=document.getElementById('route');const name=p.get('student');if(name)document.getElementById('welcome').textContent=name+' 학생, 마을의 비밀을 밝혀 보세요!';
function done(k){try{return localStorage.getItem('ttquest-'+k)==='done'||(k==='sawmill'&&localStorage.getItem('tokitoki-sawmill-generator')==='repaired')}catch(e){return false}}
function draw(){route.replaceChildren();let all=true;stages.forEach(([key,emoji,title,desc,file],i)=>{const completed=done(key);if(!completed)all=false;const a=document.createElement('a');a.className='step'+(completed?' done':'');const u=new URL(file,location.href);for(const k of ['student','group'])if(p.has(k))u.searchParams.set(k,p.get(k));a.href=u.href;a.innerHTML='<div class="emoji">'+emoji+'</div><div><strong>'+(i+1)+'. '+title+'</strong><small>'+(completed?'✓ 완료 · 다시 플레이 가능':desc)+'</small></div><span class="arrow">›</span>';route.append(a)});document.getElementById('finish').style.display=all?'block':'none'}
document.getElementById('restart').onclick=()=>{if(!confirm('이 기기에 저장된 할로윈 모험 진행 상황을 초기화할까요?'))return;stages.forEach(([key])=>localStorage.removeItem('ttquest-'+key));localStorage.removeItem('tokitoki-sawmill-generator');localStorage.removeItem('tokitoki-sawmill-wood');draw()};draw();
</script></body></html>
