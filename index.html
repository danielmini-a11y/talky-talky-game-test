<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>토키토키 · 할로윈 마을 입장</title><style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:system-ui,'Noto Sans KR',sans-serif;background:#100c26;color:#ffedce}body{min-height:100dvh;overflow-x:hidden}.world{position:relative;min-height:100dvh;max-width:900px;margin:auto;overflow:hidden;background:radial-gradient(ellipse at 52% 23%,#6c5679 0,#29244f 35%,#171530 73%,#0f1128);isolation:isolate}.stars{position:absolute;inset:0 0 35%;background-image:radial-gradient(#fff9d4 1px,transparent 1px);background-size:41px 39px;opacity:.45;pointer-events:none}.moon{position:absolute;top:6%;right:12%;width:92px;height:92px;border-radius:50%;background:#ffe7ae;box-shadow:0 0 40px #fff2a5aa,0 0 110px #ffe0a64d}.hills{position:absolute;left:-10%;width:120%;height:38%;bottom:22%;border-radius:50% 50% 0 0;background:linear-gradient(#343352,#25233f);transform:rotate(-3deg)}.hills:after{content:'';position:absolute;left:12%;top:29%;width:90%;height:100%;border-radius:50% 50% 0 0;background:#29223d;transform:rotate(8deg)}.path{position:absolute;bottom:-12%;left:15%;width:70%;height:47%;background:linear-gradient(#665063,#3e344b);clip-path:polygon(44% 0,57% 0,100% 100%,0 100%);filter:drop-shadow(0 0 10px #dca46b)}.ground{position:absolute;bottom:0;width:100%;height:28%;background:linear-gradient(#24263c,#131a2d);z-index:-1}.fog{position:absolute;bottom:15%;width:100%;height:25%;background:linear-gradient(transparent,#b2a1b41a,transparent);pointer-events:none}.top{position:relative;z-index:5;text-align:center;padding:25px 16px 0;text-shadow:0 3px 9px #000}.top h1{margin:0;font-size:clamp(24px,5.5vw,38px);color:#ffe3a5}.top p{font-size:14px;margin:8px auto;color:#f5d9c7;line-height:1.6}.village{position:relative;height:min(62dvh,620px);min-height:400px;margin-top:3px}.building{position:absolute;z-index:2;border:0;background:transparent;color:#fff1c9;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;filter:drop-shadow(0 7px 9px #000a);transform:translate(-50%,-50%);transition:transform .18s}.building:active{transform:translate(-50%,-50%) scale(.93)}.building .art{font-size:clamp(53px,12vw,98px);line-height:1.1}.building .sign{background:#231b3de8;border:1px solid #dfb57b;border-radius:9px;padding:5px 8px;font-size:12px;white-space:nowrap;font-weight:800}.building.done .sign{border-color:#8bdab0;color:#b6f4c9}.b1{top:38%;left:21%}.b2{top:38%;left:77%}.b3{top:61%;left:15%}.b4{top:62%;left:84%}.b5{top:78%;left:37%}.b6{top:80%;left:67%}.npc{position:absolute;z-index:3;left:50%;top:53%;transform:translate(-50%,-50%);font-size:67px;filter:drop-shadow(0 10px 12px #000)}.dialog{position:relative;z-index:7;background:#271d3cf2;border:2px solid #d8a96f;border-radius:20px;margin:-8px 16px 16px;padding:16px;box-shadow:0 12px 32px #0008}.dialog strong{color:#ffe3a6}.dialog p{font-size:14px;line-height:1.7;margin:8px 0 13px}.actions{display:flex;gap:8px}.actions button,.actions a{flex:1;border-radius:12px;border:1px solid #f5d69a;padding:13px 8px;text-align:center;font-size:14px;font-weight:800;cursor:pointer;text-decoration:none;background:linear-gradient(#f8d898,#d79d58);color:#312139}.actions a{background:#493657;color:#fff0d2}.hint{font-size:12px;text-align:center;color:#bcaac7;margin:8px 0}.blocked{opacity:.8}@media(max-width:420px){.building .art{font-size:59px}.building .sign{font-size:11px}.npc{font-size:55px}.village{height:53dvh;min-height:370px}.dialog{margin-top:0}} 
/* 기존 GitHub 업로드 원본 이미지를 각 장소의 미리보기로 사용 */
.building .art{display:block;width:clamp(86px,21vw,150px);height:clamp(85px,20vw,135px);font-size:0;background-size:cover;background-position:center;border-radius:14px;border:2px solid #e9bd78;box-shadow:0 7px 20px #0009}.b1 .art{background-image:url("halloween_pumpkin_farm_vertical.webp")}.b2 .art{background-image:url("library-background.webp")}.b3 .art{background-image:url("chapel_cobweb_overlay.webp")}.b4 .art{background-image:url("halloween_pumpkin_farm_vertical.webp")}.b5 .art{background-image:url("costume_shop_master.webp")}.b6 .art{background-image:url("costume_shop_master.webp")}.building .sign{font-size:12px}.npc{font-size:68px}@media(max-width:420px){.building .art{width:90px;height:90px}.b1{top:30%}.b2{top:30%}.b3{top:55%}.b4{top:55%}.b5{top:79%}.b6{top:79%}.npc{top:48%}}
</style></head><body><main class="world"><div class="stars"></div><div class="moon"></div><div class="hills"></div><div class="path"></div><div class="ground"></div><div class="fog"></div><header class="top"><h1>🎃 신비한 할로윈 마을</h1><p id="welcome">마을에 오신 것을 환영합니다! 건물을 눌러 탐험하세요.</p></header><section class="village" aria-label="할로윈 마을"><button class="building b1" data-stage="0"><span class="art">🏭</span><span class="sign">유령 제재소</span></button><button class="building b2" data-stage="1"><span class="art">🏛️</span><span class="sign">마법 도서관</span></button><button class="building b3" data-stage="2"><span class="art">⛪</span><span class="sign">오래된 예배당</span></button><button class="building b4" data-stage="3"><span class="art">🎃</span><span class="sign">호박농장</span></button><button class="building b5" data-stage="4"><span class="art">🎭</span><span class="sign">코스튬 숍</span></button><button class="building b6" data-stage="5"><span class="art">🏘️</span><span class="sign">마을 광장</span></button><div class="npc" aria-hidden="true">🧙🏻‍♀️</div></section><section class="dialog"><strong id="npcTitle">🧙 마을 안내인</strong><p id="npcText">어서 와! 마을에 수상한 일이 생겼어. 먼저 유령 제재소의 발전기를 복구해 줘. 건물을 눌러도 되고 아래의 모험 시작 버튼을 눌러도 돼!</p><div class="actions"><button id="start">🚪 모험 시작</button><a id="map" href="./map.html">🗺️ 진행 상황</a></div><div class="hint" id="hint">첫 번째 미션 · 유령 제재소</div></section></main><script>
const stages=[['sawmill','유령 제재소','sawmill.html'],['library','마법 도서관','library.html'],['chapel','오래된 예배당','chapel.html'],['pumpkin','호박농장','pumpkin-original.html'],['costume','코스튬 숍','costume-find.html'],['square','마을 광장','square.html']];
const p=new URLSearchParams(location.search);const student=p.get('student');if(student)document.getElementById('welcome').textContent=student.slice(0,30)+' 학생, 할로윈 마을에 오신 것을 환영합니다!';
function done(k){try{return localStorage.getItem('ttquest-'+k)==='done'||(k==='sawmill'&&localStorage.getItem('tokitoki-sawmill-generator')==='repaired')}catch(e){return false}}
function link(file){const u=new URL(file,location.href);for(const k of ['student','group'])if(p.has(k))u.searchParams.set(k,p.get(k));return u.href}
document.getElementById('map').href=link('map.html');
const next=stages.findIndex(x=>!done(x[0]));const current=next<0?5:next;
function enter(i){const [key,name,file]=stages[i];if(i>current&&!done(key)){document.getElementById('npcTitle').textContent='🔒 아직 잠긴 장소';document.getElementById('npcText').textContent='먼저 '+stages[current][1]+' 미션을 완료해야 '+name+'에 들어갈 수 있어!';document.getElementById('hint').textContent='현재 진행: '+stages[current][1];return}location.href=link(file)}
document.querySelectorAll('[data-stage]').forEach(b=>{const i=Number(b.dataset.stage);if(done(stages[i][0]))b.classList.add('done');b.onclick=()=>enter(i)});
document.getElementById('start').onclick=()=>enter(current);
if(next<0){document.getElementById('npcText').textContent='대단해! 모든 퀘스트를 완료했어. 마을 건물에서 다시 도전하거나 진행 상황에서 결과를 확인해 봐!';document.getElementById('start').textContent='🏆 마지막 미션 다시 보기'}else{document.getElementById('npcText').textContent='어서 와! 할로윈 마을의 비밀을 함께 밝혀 보자. 이제 '+stages[current][1]+'에 가서 미션을 해결해 줘!';document.getElementById('hint').textContent='다음 미션 · '+stages[current][1]}
</script></body></html>
