<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토키토키 할로윈 마을 · 입구</title><style>*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 50% 45%,#614066,#171324 75%);color:#fff2d2;font-family:system-ui,sans-serif;min-height:100dvh;display:grid;place-items:center;text-align:center}.gate{padding:25px 18px;max-width:520px;width:100%}.sky{font-size:70px;filter:drop-shadow(0 0 28px #ffc067)}h1{font-size:32px;color:#ffe0a0;text-shadow:0 3px 12px #000}p{line-height:1.9;color:#eed7c5}.village{font-size:60px;letter-spacing:8px;padding:24px 0;background:linear-gradient(transparent,#301b36);border-radius:22px;margin:20px 0}button,a{display:block;width:100%;padding:17px;background:linear-gradient(#f8d58b,#bd7943);border:2px solid #ffe3a4;border-radius:16px;color:#301d30;font-weight:900;font-size:20px;text-decoration:none;margin:12px 0;cursor:pointer}.small{font-size:13px;color:#c8b7c8}a.alt{background:#36283e;color:#ffe4af;font-size:15px}</style></head><body><main class="gate"><div class="sky">🌕</div><h1>🎃 신비한 할로윈 마을</h1><p>오래된 마을에 이상한 일이 일어나고 있어요.<br>숨겨진 단서를 찾고 영어 미션을 해결해<br>마을의 비밀을 밝혀 보세요!</p><div class="village">🏚️ 🏘️ 🕯️</div><button id="start">🚪 마을 입구로 들어가기</button><a class="alt" href="./map.html">🗺️ 이어서 모험하기</a><p class="small">토키토키 영어학원 · Halloween Adventure</p></main><script>const p=new URLSearchParams(location.search);for(const a of document.querySelectorAll('a')){const u=new URL(a.href);for(const k of ['student','group'])if(p.has(k))u.searchParams.set(k,p.get(k));a.href=u.href}document.getElementById('start').onclick=()=>{const u=new URL('map.html',location.href);for(const k of ['student','group'])if(p.has(k))u.searchParams.set(k,p.get(k));location.href=u.href}</script></body></html>
