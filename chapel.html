<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>토키토키 · 예배당 거미줄 방어전</title><style>
*{box-sizing:border-box}body{margin:0;background:#100d28;color:#fff3dc;font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:760px;margin:auto;padding:9px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(18px,4.7vw,26px);margin:8px 0}a{color:#ffdc91;font-size:13px}.hud{display:flex;justify-content:space-between;align-items:center;background:#28203f;border:1px solid #967b95;border-radius:12px;padding:10px;font-size:clamp(12px,3.4vw,17px);font-weight:900;margin-bottom:8px}.game{position:relative;overflow:hidden;height:min(72dvh,690px);min-height:430px;border:4px solid #ba946b;border-radius:23px;background:radial-gradient(ellipse at 50% 25%,#7c6a94,transparent 57%),linear-gradient(180deg,#172449,#382a4d 65%,#4d3348);touch-action:none;user-select:none;box-shadow:inset 0 0 80px #070719}canvas{display:block;width:100%;height:100%;touch-action:none}.game-label{position:absolute;top:9px;left:9px;right:9px;text-align:center;pointer-events:none;background:#150d31c7;border-radius:12px;padding:8px;font-weight:850;font-size:clamp(12px,3.2vw,16px)}.controls{display:flex;gap:8px;margin-top:9px}.controls button{border:0;border-radius:14px;padding:14px 8px;font-size:clamp(15px,4vw,19px);font-weight:900;background:#f5cd80;color:#3e2954;flex:1;cursor:pointer}.controls button:first-child{background:#9a67c7;color:white;flex:2}.overlay{position:fixed;inset:0;z-index:10;background:#08061cd9;display:flex;align-items:center;justify-content:center;padding:14px}.overlay[hidden]{display:none}.panel{width:min(96vw,560px);max-height:94dvh;overflow-y:auto;background:linear-gradient(#fff3da,#f3dbb6);border:4px solid #bb915d;border-radius:25px;padding:clamp(16px,4vw,25px);color:#422950;text-align:center;box-shadow:0 25px 75px #000b}.panel h2{font-size:clamp(23px,5.5vw,30px);margin:8px 0 16px}.panel p{font-size:clamp(16px,4vw,19px);font-weight:700;line-height:1.65}.guide{display:flex;align-items:center;gap:14px;text-align:left}.guide .portrait{font-size:clamp(65px,17vw,100px)}button{font-family:inherit}.primary,.choice,.listen{border:0;border-radius:14px;font-weight:900;cursor:pointer;font-size:clamp(16px,4.2vw,20px);padding:14px}.primary{width:100%;margin-top:15px;background:linear-gradient(110deg,#8a5cb5,#69408e);color:white}.choice{display:block;width:100%;margin:8px 0;background:#f7cf83;color:#3c2a4c}.listen{background:#dfbf95;color:#4c305c}.feedback{min-height:24px;color:#b63c6b;font-weight:900}.round-tag{display:inline-block;background:#ead1a9;border-radius:18px;padding:7px 13px;font-size:13px;font-weight:900}.ending-guide{font-size:clamp(65px,20vw,120px);margin:0 auto}.ending-speech{border:2px solid #b28ac3;background:#fffdf5;border-radius:18px;padding:15px;margin:12px 0;font-size:clamp(17px,4.4vw,22px);font-weight:800;line-height:1.6}.legend{font-size:13px;opacity:.88;text-align:center;margin:8px 0}@media(max-height:700px){.game{height:67dvh;min-height:365px}.panel{padding:14px}.panel p{font-size:15px}}
</style></head><body><main><header><h1>⛪ 예배당 · 거미줄 방어전</h1><a href="./index.html">미션 선택</a></header><div class="hud"><span id="round">🕸️ 1 / 5 라운드</span><span id="clock">⏱️ 25초</span><span id="shield">🛡️ 5 / 5</span></div><div class="game" id="game"><canvas id="canvas"></canvas><div class="game-label" id="label">검은 거미가 거미줄을 치기 전에 빗자루를 던지세요!</div></div><div class="controls"><button id="throw">🧹 빗자루 던지기</button><button id="sound">🔊 소리 켜짐</button></div><div class="legend">화면을 터치해 조준하고 빗자루를 던지거나, 아래 발사 버튼을 누르세요.</div></main><div class="overlay" id="overlay"><div class="panel"><div id="content"><h2>🕸️ 예배당에 드리운 그림자</h2><div class="guide"><span class="portrait">👨‍🏫</span><p>어서 오렴! 나는 역사 안내인 다니엘이야. 검은 거미들이 흰 실을 타고 내려와 예배당을 거미줄로 덮으려 하고 있어! 빗자루로 거미들을 쫓아내고 오래된 기록도 함께 살펴보자.</p></div><p>라운드마다 거미가 빨라지고 더 많이 나타나. 화면이 거미줄로 덮이기 전에 막아야 해!</p></div><button class="primary" id="action">🧹 빗자루를 들고 시작!</button></div></div><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d'),overlay=$('overlay'),content=$('content'),action=$('action');let W=500,H=650,round=0,playing=false,paused=true,clock=25,shield=5,web=0,spiders=[],brooms=[],particles=[],last=0,spawn=0,hitCount=0,shotAt=0,aim={x:.5,y:.4},audio=null,muted=false,stageTime=0;const maxRounds=5,questions=[{q:'What does “All Hallows’ Eve” mean?',answers:['모든 성인의 날 전날 밤','호박 농장의 수확일','새해 첫날'],right:0,story:'Halloween이라는 이름은 All Hallows’ Eve라는 표현과 관련이 있어. 모든 성인의 날 전날 밤이라는 뜻이지.'},{q:'When is All Saints’ Day in many Western churches?',answers:['October 31','November 1','December 25'],right:1,story:'많은 서방 교회 전통에서 모든 성인의 날은 11월 1일이야. 그 전날 저녁이 All Hallows’ Eve였단다.'},{q:'Which word means “spider web”?',answers:['Broom','Spider web','Pumpkin'],right:1,story:'Spider web은 거미줄, broom은 빗자루야. 영어로 사물의 이름도 익혀 보자.'},{q:'Which sentence is correct?',answers:['Every church has the same Halloween customs.','Halloween has only one historical source.','Modern customs come from different traditions.'],right:2,story:'오늘날의 할로윈 문화에는 여러 시대와 지역의 풍습이 섞여 있어. 역사와 신앙, 현대 놀이 문화를 구분해 이해하자.'},{q:'What was used for lanterns before pumpkins became common?',answers:['Turnips','Pineapples','Coconuts'],right:0,story:'아일랜드 등지에서는 순무를 파서 등불을 만들기도 했어. 다음 호박 농장에서 잭오랜턴의 역사를 알아보자.'}];function resize(){const r=canvas.getBoundingClientRect();W=Math.max(300,r.width);H=Math.max(360,r.height);const d=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*d);canvas.height=Math.round(H*d);ctx.setTransform(d,0,0,d,0,0)}window.addEventListener('resize',resize);resize();function sound(type){if(muted)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();const o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime;o.type=type==='throw'?'triangle':type==='hit'?'sine':'sawtooth';o.frequency.setValueAtTime(type==='throw'?520:type==='hit'?780:160,t);o.frequency.exponentialRampToValueAtTime(type==='throw'?170:type==='hit'?260:85,t+.16);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.12,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.24)}catch(e){}}function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=/[가-힣]/.test(t)?'ko-KR':'en-US';u.rate=.9;speechSynthesis.speak(u)}function show(html,btn,fn){paused=true;content.innerHTML=html;action.textContent=btn;action.onclick=fn;overlay.hidden=false}function hide(){overlay.hidden=true;paused=false;last=performance.now()}function hud(){$('round').textContent='🕸️ '+(round+1)+' / '+maxRounds+' 라운드';$('clock').textContent='⏱️ '+Math.max(0,Math.ceil(clock))+'초';$('shield').textContent='🛡️ '+shield+' / 5'}function startRound(){spiders=[];brooms=[];particles=[];web=0;shield=5;clock=25;spawn=.5;stageTime=0;hitCount=0;playing=true;hud();$('label').textContent='거미가 내려와 거미줄을 치기 전에 빗자루를 던져요!';hide()}function burst(x,y,clr){for(let i=0;i<15;i++)particles.push({x,y,vx:(Math.random()-.5)*190,vy:(Math.random()-.5)*190,life:.7,color:clr})}function throwBroom(){if(!playing||paused||performance.now()-shotAt<230)return;shotAt=performance.now();sound('throw');brooms.push({x:W*.5,y:H*.91,tx:aim.x*W,ty:aim.y*H,life:0});}function spawnSpider(){const x=W*(.08+Math.random()*.84);spiders.push({x,y:-20,base:x,speed:(32+round*13+Math.random()*20)*H/620,phase:Math.random()*7,kind:Math.random()<.13?'big':'normal',thread:0,attack:0,warning:false});}function damage(){shield--;web=Math.min(1,web+.13);sound('hurt');hud();if(shield<=0||web>=.92)fail()}function hitSpider(s){const idx=spiders.indexOf(s);if(idx>=0)spiders.splice(idx,1);hitCount++;burst(s.x,s.y,'#e8b8ff');sound('hit')}function finishRound(){playing=false;paused=true;const q=questions[round];const html='<span class="round-tag">라운드 '+(round+1)+' / '+maxRounds+' 통과</span><h2>📜 역사 기록을 발견했어!</h2><p>'+q.q+'</p><button class="listen" id="listen">🔊 영어 듣기</button><div id="choices">'+q.answers.map((a,i)=>'<button class="choice" data-choice="'+i+'">'+a+'</button>').join('')+'</div><p class="feedback" id="feedback"></p>';show(html,'영어 문제를 풀어 주세요',()=>{});action.disabled=true;action.style.opacity='.5';$('listen').onclick=()=>speak(q.q);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(+b.dataset.choice!==q.right){$('feedback').textContent='아쉬워! 다시 골라 보자.';sound('hurt');return}action.disabled=false;action.style.opacity='1';show('<h2>✨ 정답! 단서 획득</h2><p>'+q.story+'</p>',round===maxRounds-1?'▶ 안내인 이야기 듣기':'▶ 다음 라운드',()=>{if(round===maxRounds-1)ending();else{round++;startRound()}});speak('정답이야! '+q.story)});speak(q.q)}function fail(){playing=false;show('<h2>🕸️ 거미줄에 덮였어!</h2><p>거미들이 예배당을 덮었어. 괜찮아! 같은 라운드부터 다시 도전하자.</p>','↻ 이 라운드 다시 시작',startRound)}function ending(){localStorage.setItem('tokitoki-halloween-chapel-complete','1');const lines=['정말 잘했어! 거미들을 모두 쫓아내고 예배당을 지켜냈구나.','할로윈이라는 이름은 모든 성인의 날 전날 밤을 가리키던 말과 연결돼 있어. 오늘날의 풍습은 여러 문화가 섞여 발전했단다.','다음에는 호박 농장으로 가 보렴! 순무 등불이 어떻게 호박 등불이 되었는지 알아보자.'];let n=0;function scene(){show('<div class="ending-guide">👨‍🏫</div><h2>역사 안내인 다니엘</h2><div class="ending-speech">'+lines[n]+'</div>',n===lines.length-1?'▶ 미션 선택으로':'계속 듣기 ›',()=>{n++;if(n<lines.length)scene();else location.href='./index.html?chapel=complete'});speak(lines[n])}scene()}function update(dt){if(!playing||paused)return;stageTime+=dt;clock-=dt;spawn-=dt;if(spawn<=0){spawnSpider();spawn=.78-round*.095+Math.random()*.28;if(round>=3&&Math.random()<.22)spawnSpider()}for(let i=spiders.length-1;i>=0;i--){const s=spiders[i];s.thread+=dt;s.y+=s.speed*dt;s.x=s.base+Math.sin(s.thread*(1.4+round*.12)+s.phase)*(15+round*5);if(s.y>H*.71&&!s.warning){s.warning=true;s.attack=1.2-round*.12}if(s.warning){s.attack-=dt;if(s.attack<=0){spiders.splice(i,1);damage();if(!playing)return}}}for(let i=brooms.length-1;i>=0;i--){const b=brooms[i];b.life+=dt;const t=Math.min(1,b.life/.26),x=b.x+(b.tx-b.x)*t,y=b.y+(b.ty-b.y)*t;b.cx=x;b.cy=y;let target=spiders.find(s=>Math.hypot(s.x-x,s.y-y)<Math.max(26,W*.055));if(target){hitSpider(target);burst(x,y,'#ffe3a0');brooms.splice(i,1)}else if(t>=1)brooms.splice(i,1)}for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(clock<=0){clock=0;finishRound()}hud()}function draw(){ctx.clearRect(0,0,W,H);const scale=W/500;ctx.save();ctx.strokeStyle='#9d809b';ctx.lineWidth=12*scale;ctx.beginPath();ctx.moveTo(W*.17,H*.72);ctx.lineTo(W*.17,H*.17);ctx.quadraticCurveTo(W*.5,-H*.12,W*.83,H*.17);ctx.lineTo(W*.83,H*.72);ctx.stroke();ctx.fillStyle='#27436d99';ctx.beginPath();ctx.moveTo(W*.2,H*.7);ctx.lineTo(W*.2,H*.17);ctx.quadraticCurveTo(W*.5,-H*.08,W*.8,H*.17);ctx.lineTo(W*.8,H*.7);ctx.fill();ctx.strokeStyle='#d6a876';ctx.lineWidth=4*scale;ctx.beginPath();ctx.moveTo(W*.5,H*.13);ctx.lineTo(W*.5,H*.69);ctx.moveTo(W*.2,H*.42);ctx.lineTo(W*.8,H*.42);ctx.stroke();ctx.font=Math.round(67*scale)+'px serif';ctx.textAlign='center';ctx.fillText('✦',W*.5,H*.34);ctx.fillStyle='#79576a';ctx.fillRect(0,H*.72,W,H*.28);ctx.fillStyle='#a77b64';for(let i=0;i<5;i++){ctx.fillRect(i*W/4-W*.1,H*(.78+i*.025),W*.23,H*.045)}ctx.restore();for(const s of spiders){ctx.strokeStyle='rgba(248,248,255,.95)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(s.base,0);ctx.lineTo(s.x,s.y-13);ctx.stroke();if(s.warning){ctx.shadowColor='#ff1b32';ctx.shadowBlur=22;ctx.fillStyle='#ff3c45';ctx.beginPath();ctx.arc(s.x,s.y,27,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}const r=s.kind==='big'?28:22;ctx.strokeStyle=s.warning?'#ff5762':'#0a0814';ctx.lineWidth=4;for(let j=0;j<4;j++){let yy=s.y-r*.55+j*r*.36;ctx.beginPath();ctx.moveTo(s.x-r*.5,yy);ctx.lineTo(s.x-r*1.1,yy-9);ctx.moveTo(s.x+r*.5,yy);ctx.lineTo(s.x+r*1.1,yy-9);ctx.stroke()}ctx.fillStyle='#08070e';ctx.beginPath();ctx.ellipse(s.x,s.y,r*.7,r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fa404b';ctx.beginPath();ctx.arc(s.x-r*.22,s.y-r*.26,3.6,0,7);ctx.arc(s.x+r*.22,s.y-r*.26,3.6,0,7);ctx.fill()}for(const b of brooms){const x=b.cx??b.x,y=b.cy??b.y;ctx.save();ctx.translate(x,y);ctx.rotate(-.7+b.life*9);ctx.font='38px serif';ctx.textAlign='center';ctx.fillText('🧹',0,0);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3+3*p.life,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#fff3adbb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x*W,aim.y*H,16,0,Math.PI*2);ctx.moveTo(aim.x*W-25,aim.y*H);ctx.lineTo(aim.x*W-10,aim.y*H);ctx.moveTo(aim.x*W+10,aim.y*H);ctx.lineTo(aim.x*W+25,aim.y*H);ctx.stroke();ctx.font='45px serif';ctx.textAlign='center';ctx.fillText('🧹',W*.5,H*.93);if(web>0){ctx.save();ctx.globalAlpha=web*.8;ctx.strokeStyle='#f6f5ff';ctx.lineWidth=2;for(let j=0;j<8;j++){const cx=(j%4)*W/3,cy=(j<4?0:H);for(let k=0;k<6;k++){const a=k*Math.PI/3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*W*.55,cy+Math.sin(a)*H*.5);ctx.stroke()}for(let r=20;r<W*.7;r+=35){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}}ctx.restore()}if(playing&&paused){ctx.fillStyle='#0005';ctx.fillRect(0,0,W,H)}}function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function setAim(e){const r=canvas.getBoundingClientRect();aim.x=Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width));aim.y=Math.max(.03,Math.min(.8,(e.clientY-r.top)/r.height))}canvas.addEventListener('pointerdown',e=>{setAim(e);throwBroom()});canvas.addEventListener('pointermove',e=>{if(e.buttons)setAim(e)});$('throw').onclick=throwBroom;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐'};action.onclick=startRound;hud()})();
</script></body></html>
