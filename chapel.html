<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>토키토키 · 오래된 예배당</title><style>
*{box-sizing:border-box}body{margin:0;background:#0d0b23;color:#fff4db;font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:740px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}h1{font-size:clamp(19px,5vw,27px);margin:10px 0}a{color:#ffdc96}.hud{display:flex;justify-content:space-between;padding:12px;background:#28203e;border:1px solid #977b91;border-radius:12px;font-weight:800;margin-bottom:12px}.stage{height:min(72dvh,740px);min-height:460px;position:relative;overflow:hidden;border:4px solid #b99970;border-radius:22px;background:radial-gradient(ellipse at 50% 15%,#8b7c9b 0%,transparent 40%),linear-gradient(180deg,#172446 0%,#3c3151 56%,#4e3545 100%);box-shadow:inset 0 0 85px #090b21}.arch{position:absolute;left:15%;right:15%;top:6%;height:64%;border:16px solid #806474;border-bottom:0;border-radius:49% 49% 0 0;background:linear-gradient(135deg,#25436b 0 27%,#c48671 28% 31%,#38558a 32% 47%,#e1b779 48% 51%,#533b78 52% 68%,#a56981 69% 72%,#25436b 73%);box-shadow:0 0 65px #ebbb8544,inset 0 0 25px #080c2a}.arch:after{content:'✦';position:absolute;inset:0;display:grid;place-items:center;font-size:100px;color:#ffe6a7;text-shadow:0 0 40px #fff3ac}.pews{position:absolute;bottom:0;left:0;right:0;height:35%;background:repeating-linear-gradient(90deg,#503343 0 14%,#9a664e 14% 16%,#503343 16% 32%);border-top:15px solid #af8063;clip-path:polygon(0 36%,50% 0,100% 36%,100% 100%,0 100%)}.bell{position:absolute;top:7%;right:6%;font-size:60px;filter:drop-shadow(0 0 18px #ffcc73)}.station{position:absolute;z-index:2;width:30%;max-width:180px;min-height:92px;border:2px solid #e7c184;border-radius:20px;background:linear-gradient(150deg,#39244edc,#160e2bdd);color:#fff4d4;font-weight:900;font-size:clamp(13px,3.3vw,17px);box-shadow:0 9px 24px #0008;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px;touch-action:manipulation}.station .symbol{font-size:clamp(34px,9vw,53px)}.station.done{opacity:.55;border-color:#8dd2b2}.station:active{transform:scale(.96)}#st0{left:4%;top:44%}#st1{right:4%;top:44%}#st2{left:35%;bottom:5%}.narrator{position:absolute;left:3%;right:3%;bottom:2%;z-index:3;background:#1b1235e8;border:2px solid #bb986a;border-radius:16px;padding:12px;text-align:center;font-size:clamp(13px,3.5vw,17px);font-weight:750}.overlay{position:fixed;inset:0;z-index:10;background:#050516dc;display:flex;justify-content:center;align-items:center;padding:14px}.overlay[hidden]{display:none}.panel{max-width:540px;width:100%;background:linear-gradient(#fff5df,#f3dbb4);color:#3d2b4f;border:4px solid #b48b62;border-radius:25px;padding:clamp(17px,4vw,27px);text-align:center;box-shadow:0 20px 65px #000a}.panel h2{font-size:clamp(22px,5.5vw,29px)}.panel p{font-size:clamp(16px,4vw,19px);line-height:1.6;font-weight:650}.panel .guide{display:flex;align-items:center;gap:14px;text-align:left}.guide .portrait{font-size:clamp(60px,17vw,96px)}button{font-family:inherit}.primary,.choice,.listen{border:0;border-radius:13px;padding:15px;font-size:clamp(16px,4vw,20px);font-weight:900;cursor:pointer}.primary{background:#7950a3;color:white;width:100%;margin-top:12px}.choice{display:block;width:100%;background:#f8d083;color:#382647;margin:9px 0}.listen{background:#e8cba0;color:#4b3057;margin-bottom:8px}.feedback{color:#974363;min-height:24px;font-weight:900}.finish{color:#6b4592}.spark{position:absolute;pointer-events:none;z-index:5;font-size:60px;animation:burst .8s ease-out forwards}@keyframes burst{to{transform:translateY(-50px) scale(2);opacity:0}}@media(max-height:700px){.stage{height:67dvh;min-height:390px}.panel{padding:14px}.station{min-height:74px}}
</style></head><body><main><header><h1>⛪ 토키토키 · 오래된 예배당</h1><a href="./index.html">미션 선택</a></header><div class="hud"><span id="progress">🔎 역사 단서 0/3</span><span id="state">🔔 종탑 조사</span></div><section class="stage" id="stage"><div class="arch"></div><div class="pews"></div><div class="bell">🔔</div><button class="station" id="st0"><span class="symbol">📜</span><span>오래된 기록</span></button><button class="station" id="st1"><span class="symbol">🕯️</span><span>기념일 달력</span></button><button class="station" id="st2"><span class="symbol">🔔</span><span>종탑의 비밀</span></button><div class="narrator" id="narrator">예배당의 세 곳을 조사해 역사 단서를 찾아보세요.</div></section></main><div class="overlay" id="overlay"><div class="panel"><div id="content"><h2>⛪ 오래된 예배당</h2><div class="guide"><span class="portrait">👨‍🏫</span><p>어서 오렴! 나는 마을 역사 안내인 다니엘이란다. 도서관에서 발견한 기록을 보니 할로윈이라는 이름에 오래된 역사가 담겨 있더구나. 이 예배당의 기록을 함께 살펴보자!</p></div></div><button class="primary" id="action">▶ 조사 시작</button></div></div><script>
(()=>{const $=id=>document.getElementById(id),overlay=$('overlay'),content=$('content'),action=$('action');const missions=[{title:'📜 오래된 기록',question:'What does “All Hallows’ Eve” mean?',answers:['모든 성인의 날 전날 밤','호박 수확 축제','새해 첫날'],correct:0,story:'All Hallows’ Eve는 모든 성인의 날 전날 밤을 가리키는 표현이야. Halloween이라는 이름과 연결되지.'},{title:'🕯️ 기념일 달력',question:'When is All Saints’ Day in many Western churches?',answers:['October 31','November 1','December 25'],correct:1,story:'많은 서방 교회 전통에서 모든 성인의 날은 11월 1일이야. 전날인 10월 31일 저녁과 이름의 관계를 알 수 있지.'},{title:'🔔 종탑의 비밀',question:'Which statement is correct?',answers:['Halloween has only one origin.','History and modern customs can be different.','All churches celebrate Halloween the same way.'],correct:1,story:'할로윈에는 여러 시대의 문화가 섞여 있어. 이름의 역사와 오늘날의 풍습을 구분해서 이해하는 것이 중요해.'}];let done=new Set();const key='tokitoki-chapel-clues';try{done=new Set(JSON.parse(localStorage.getItem(key)||'[]'))}catch(e){}function say(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=/[가-힣]/.test(t)?'ko-KR':'en-US';u.rate=.88;speechSynthesis.speak(u)}function show(html,label,fn){content.innerHTML=html;action.textContent=label;action.onclick=fn;overlay.hidden=false}function hide(){overlay.hidden=true}function refresh(){$('progress').textContent='🔎 역사 단서 '+done.size+'/3';missions.forEach((m,i)=>{$('st'+i).classList.toggle('done',done.has(i));$('st'+i).querySelector('span:last-child').textContent=done.has(i)?'✓ 조사 완료':m.title.slice(3)});if(done.size===3){$('state').textContent='✨ 역사 확인 완료';$('narrator').textContent='세 가지 단서를 모두 모았어요! 종탑을 눌러 마무리하세요.'}}function ask(i){if(done.has(i)){if(done.size===3&&i===2)ending();return}const m=missions[i];show('<h2>'+m.title+'</h2><p>'+m.question+'</p><button class="listen" id="listen">🔊 영어 듣기</button><div id="answers">'+m.answers.map((v,j)=>'<button class="choice" data-answer="'+j+'">'+v+'</button>').join('')+'</div><div class="feedback" id="feedback"></div>','← 예배당으로 돌아가기',hide);$('listen').onclick=()=>say(m.question);document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{if(Number(b.dataset.answer)!==m.correct){$('feedback').textContent='다시 생각해 보세요!';return}done.add(i);localStorage.setItem(key,JSON.stringify([...done]));refresh();show('<h2>✨ 역사 단서 획득!</h2><p>'+m.story+'</p>','▶ 계속 조사하기',()=>{hide();if(done.size===3)setTimeout(ending,350)});say('정답이야! '+m.story)})}function ending(){localStorage.setItem('tokitoki-halloween-chapel-complete','1');const lines=['잘했어! 이제 할로윈이라는 이름이 모든 성인의 날 전날 밤을 뜻하는 말에서 왔다는 사실을 알았구나.','하지만 오늘날의 할로윈 풍습은 여러 시대의 문화가 섞여 만들어졌단다. 역사와 신앙, 놀이 문화를 구분해 살펴보는 게 중요하지.','다음 목적지는 호박 농장이야! 잭오랜턴이 왜 호박으로 만들어졌는지 그 역사를 찾아보렴.'];let n=0;const draw=()=>{show('<h2>👨‍🏫 역사 안내인 다니엘</h2><div class="guide"><span class="portrait">👨‍🏫</span><p>'+lines[n]+'</p></div>',n===lines.length-1?'▶ 호박 농장으로 이동':'계속 듣기 ›',()=>{n++;if(n<lines.length)draw();else location.href='./pumpkin.html?from=chapel'});say(lines[n])};draw()}missions.forEach((m,i)=>$('st'+i).onclick=()=>ask(i));action.onclick=()=>{hide();say('예배당의 기록을 살펴보자!')};refresh();if(new URLSearchParams(location.search).has('reset')){done.clear();localStorage.removeItem(key);refresh()}})();
</script></body></html>
