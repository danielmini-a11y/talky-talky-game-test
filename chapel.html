ctx.lineTo(s.x,s.y-13);ctx.stroke();if(s.warning){ctx.shadowColor='#ff1b32';ctx.shadowBlur=22;ctx.fillStyle='#ff3c45';ctx.beginPath();ctx.arc(s.x,s.y,27,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}const r=s.kind==='big'?28:22;ctx.strokeStyle=s.warning?'#ff5762':'#0a0814';ctx.lineWidth=4;for(let j=0;j<4;j++){let yy=s.y-r*.55+j*r*.36;ctx.beginPath();ctx.moveTo(s.x-r*.5,yy);ctx.lineTo(s.x-r*1.1,yy-9);ctx.moveTo(s.x+r*.5,yy);ctx.lineTo(s.x+r*1.1,yy-9);ctx.stroke()}ctx.fillStyle='#08070e';ctx.beginPath();ctx.ellipse(s.x,s.y,r*.7,r,0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fa404b';ctx.beginPath();ctx.arc(s.x-r*.22,s.y-r*.26,3.6,0,7);ctx.arc(s.x+r*.22,s.y-r*.26,3.6,0,7);ctx.fill()}if(boss){ctx.save();ctx.translate(boss.x,boss.y);const red=boss.red;ctx.shadowColor=red>.75?'#ff163f':'#a84fff';ctx.shadowBlur=22;ctx.fillStyle='rgb('+Math.round(15+red*205)+','+Math.round(12+red*18)+','+Math.round(24+red*16)+')';for(let i=0;i<8;i++){const a=i*Math.PI/4;ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(Math.cos(a)*28,Math.sin(a)*24);ctx.lineTo(Math.cos(a)*65,Math.sin(a)*55);ctx.stroke()}ctx.beginPath();ctx.ellipse(0,0,Math.min(W*.14,72),Math.min(W*.115,59),0,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ff334a';ctx.beginPath();ctx.arc(-19,-12,9,0,7);ctx.arc(19,-12,9,0,7);ctx.fill();ctx.restore()}for(const b of brooms){const x=b.cx??b.x,y=b.cy??b.y;ctx.save();ctx.translate(x,y);ctx.rotate(-.7+b.life*9);ctx.font='38px serif';ctx.textAlign='center';ctx.fillText('🧹',0,0);ctx.restore()}for(const p of particles){ctx.globalAlpha=Math.max(0,p.life/.7);ctx.fillStyle=p.color;ctx.beginPath();ctx.arc(p.x,p.y,3+3*p.life,0,7);ctx.fill()}ctx.globalAlpha=1;ctx.strokeStyle='#fff3adbb';ctx.lineWidth=2;ctx.beginPath();ctx.arc(aim.x*W,aim.y*H,16,0,Math.PI*2);ctx.moveTo(aim.x*W-25,aim.y*H);ctx.lineTo(aim.x*W-10,aim.y*H);ctx.moveTo(aim.x*W+10,aim.y*H);ctx.lineTo(aim.x*W+25,aim.y*H);ctx.stroke();ctx.font='45px serif';ctx.textAlign='center';ctx.fillText('🧹',W*.5,H*.93);if(web>0){ctx.save();ctx.globalAlpha=web*.8;ctx.strokeStyle='#f6f5ff';ctx.lineWidth=2;for(let j=0;j<8;j++){const cx=(j%4)*W/3,cy=(j<4?0:H);for(let k=0;k<6;k++){const a=k*Math.PI/3;ctx.beginPath();ctx.moveTo(cx,cy);ctx.lineTo(cx+Math.cos(a)*W*.55,cy+Math.sin(a)*H*.5);ctx.stroke()}for(let r=20;r<W*.7;r+=35){ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.stroke()}}ctx.restore()}if(playing&&paused){ctx.fillStyle='#0005';ctx.fillRect(0,0,W,H)}}function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);function setAim(e){const r=canvas.getBoundingClientRect();aim.x=Math.max(.03,Math.min(.97,(e.clientX-r.left)/r.width));aim.y=Math.max(.03,Math.min(.8,(e.clientY-r.top)/r.height))}canvas.addEventListener('pointerdown',e=>{setAim(e);throwBroom()});canvas.addEventListener('pointermove',e=>{if(e.buttons)setAim(e)});$('throw').onclick=throwBroom;$('sound').onclick=()=>{muted=!muted;$('sound').textContent=muted?'🔇 소리 꺼짐':'🔊 소리 켜짐'};$('npc-intro').innerHTML='<img class="npc-face" src="'+npcImage+'" alt="도서관 사서 엘리"><div class="npc-talk">어서 와! 나는 사서 엘리야. 검은 거미들이 흰 실을 타고 내려와 예배당을 덮으려 해! 빗자루를 던져 쫓아내자. 각 라운드가 끝나면 거미가 영어 수수께끼를 낼 거야.</div>';action.onclick=startRound;hud()})();
