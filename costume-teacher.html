<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>토키토키 · 선생님 게임 링크 발급</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:radial-gradient(ellipse at 50% 0%,#65445d,#1b1428 75%);color:#fff0d5;font-family:system-ui,"Noto Sans KR",sans-serif}.wrap{max-width:600px;margin:auto;padding:24px 16px 50px}header{text-align:center;padding:20px 0 25px}header .logo{font-size:42px}h1{font-size:25px;margin:8px 0}header p{color:#d9c1b0;font-size:14px}section{background:linear-gradient(140deg,#432b4c,#2a2039);border:1px solid #bc955b;border-radius:20px;padding:23px 19px;margin-bottom:18px;box-shadow:0 12px 32px #0004}h2{font-size:18px;color:#ffda93;margin:0 0 16px}label{display:block;font-size:14px;font-weight:700;margin:15px 0 7px}input,textarea{display:block;width:100%;border:1px solid #b89b80;background:#fff9ed;color:#382638;border-radius:11px;padding:13px 12px;font:inherit;font-size:16px}textarea{height:105px;resize:vertical}button,a.action{border:0;border-radius:12px;background:linear-gradient(#f5cc84,#d49a4f);color:#39283a;font-size:16px;font-weight:800;padding:14px 12px;cursor:pointer;text-decoration:none;text-align:center;display:block;width:100%}button:active{transform:scale(.98)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:12px}.secondary{background:#634760;color:#fff0d9;border:1px solid #ba9a6e}.hint{font-size:12px;color:#cfb8ab;line-height:1.6;margin-top:12px}.preview{background:#24182e;border:1px solid #76536d;border-radius:12px;padding:12px;word-break:break-all;color:#ffde99;font-size:13px;margin:12px 0}.status{min-height:23px;color:#b9f4cd;font-size:13px;margin-top:9px}footer{text-align:center;color:#ad9da9;font-size:12px;padding:15px}
</style></head><body><main class="wrap"><header><div class="logo">🎭</div><h1>토키토키 선생님 페이지</h1><p>코스튬 숍 · 숨은 물건 찾기 게임 링크 발급</p></header><section><h2>🎮 학생에게 보낼 게임 링크</h2><label for="student">학생 이름 (선택)</label><input id="student" placeholder="예: 윤솔" maxlength="24" autocomplete="off"><label for="group">반 이름 (선택)</label><input id="group" placeholder="예: Story Town 1" maxlength="30" autocomplete="off"><button id="make" style="margin-top:22px">✨ 학생용 링크 생성</button><div id="result" hidden><div class="preview" id="url"></div><div class="actions"><button id="copy">📋 링크 복사</button><button id="share" class="secondary">📤 공유하기</button></div><div class="actions"><a id="play" class="action" target="_blank" rel="noopener">게임 미리보기</a><button id="copyMsg" class="secondary">안내문 복사</button></div><div class="status" id="status" role="status"></div></div><p class="hint">이름 없이 생성하면 모든 학생에게 공통으로 보낼 수 있습니다. 학생 이름은 링크에 포함되므로 실명 대신 별명을 사용해도 됩니다.</p></section><section><h2>📘 학생 안내문</h2><textarea id="notice" readonly>🎭 토키토키 코스튬 숍 게임!
숨은 물건 8개를 찾아보세요.
물건을 찾으면 영어 퀴즈에 도전합니다.
4분마다 힌트 도전권이 생깁니다.
아래 게임 링크를 눌러 시작하세요!</textarea><p class="hint">학생에게는 이 선생님 페이지가 아닌, 생성한 게임 링크만 보내세요. 이 페이지는 비밀번호로 보호되지 않은 단순 링크 발급 도구입니다.</p></section><footer>Talky Talky English Academy · Teacher Link Generator</footer></main><script>
const base=new URL('costume-find.html',location.href),student=document.getElementById('student'),group=document.getElementById('group'),url=document.getElementById('url'),result=document.getElementById('result'),status=document.getElementById('status'),play=document.getElementById('play');let current='';
function make(){const u=new URL(base);if(student.value.trim())u.searchParams.set('student',student.value.trim());if(group.value.trim())u.searchParams.set('group',group.value.trim());current=u.href;url.textContent=current;play.href=current;result.hidden=false;status.textContent='학생용 링크가 준비되었습니다.'}
async function copyText(value){try{await navigator.clipboard.writeText(value);status.textContent='복사되었습니다!'}catch(e){const t=document.createElement('textarea');t.value=value;document.body.append(t);t.select();try{document.execCommand('copy');status.textContent='복사되었습니다!'}catch(e){status.textContent='복사할 내용을 길게 눌러 선택해 주세요.'}t.remove()}}
document.getElementById('make').onclick=make;document.getElementById('copy').onclick=()=>copyText(current);document.getElementById('copyMsg').onclick=()=>copyText(document.getElementById('notice').value+'\n'+current);document.getElementById('share').onclick=async()=>{if(!navigator.share){copyText(current);return}try{await navigator.share({title:'토키토키 코스튬 숍 게임',text:'숨은 물건을 찾고 영어 퀴즈에 도전하세요!',url:current})}catch(e){if(e.name!=='AbortError')status.textContent='공유할 수 없어 링크를 복사해 주세요.'}};make();
</script></body></html>
