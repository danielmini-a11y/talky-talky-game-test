<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>토키토키 코스튬 숨은 물건 찾기</title><style>*{box-sizing:border-box}body{margin:0;background:#1a1020;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#271a30;gap:8px}.bar strong{font-size:15px}.bar small{display:block;color:#e7c99c;font-size:11px}.bar button{background:#f3c577;border:0;border-radius:12px;padding:10px;font-weight:800}#view{position:relative;width:100vw;height:calc(100dvh - 122px);overflow:hidden;touch-action:none;cursor:grab;background:#0c0811}#world{position:absolute;left:0;top:0;width:2141px;height:734px;transform-origin:0 0;will-change:transform}#world img{position:absolute;display:block;user-select:none;pointer-events:none}#bottom{height:58px;display:flex;align-items:center;justify-content:space-around;background:#271a30;font-size:13px}#bottom button{border:1px solid #ba8a55;border-radius:10px;padding:8px 12px;background:#4b3049;color:#fff}#zoom{font-weight:800;color:#ffd78c}</style><style>
#view{height:calc(100dvh - 226px)}#bottom{height:62px}#inventory{height:104px;display:flex;gap:5px;align-items:stretch;padding:7px 5px;background:#422637;border-top:2px solid #c38a50;overflow-x:auto;scrollbar-width:thin}.slot{flex:1 0 0;min-width:38px;border:1px solid #b88446;border-radius:9px;background:#f5dfad;color:#432b24;text-align:center;padding:4px 2px;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:2px}.slot img{height:52px;width:100%;object-fit:contain}.slot small{font-size:9px;font-weight:800;white-space:nowrap}.slot.acquired{opacity:.45;filter:grayscale(.8)}@media(max-width:430px){.slot img{height:42px}.slot small{font-size:8px}#inventory{height:90px}#view{height:calc(100dvh - 212px)}}
#mission{height:62px;background:#342238;color:#fff;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;gap:8px}
#mission strong{font-size:14px;color:#ffdc9c}#mission small{display:block;font-size:11px;color:#ead7c5}
#mission button{border:1px solid #b68b52;background:#5c3b50;color:#fff;padding:9px;border-radius:9px;font-weight:bold}
.find-object{position:absolute;display:flex;align-items:center;justify-content:center;width:44px;height:44px;font-size:25px;line-height:1;cursor:pointer;user-select:none;touch-action:none;filter:drop-shadow(0 2px 2px #0008);transition:opacity .2s}
.find-object.found{opacity:0;pointer-events:none}.find-object.picked{animation:pickup .65s ease-out forwards;z-index:8}@keyframes pickup{0%{transform:scale(1);opacity:1;filter:drop-shadow(0 0 4px #ffe08b)}45%{transform:scale(2.3) rotate(-8deg);opacity:1;filter:drop-shadow(0 0 20px #ffdf70)}100%{transform:scale(.15) translateY(-80px);opacity:0}}
#toast{position:absolute;top:14px;left:50%;transform:translateX(-50%);background:#23172de8;color:#ffe4a7;border:1px solid #e6b86a;border-radius:12px;padding:9px 13px;font-weight:800;z-index:5;pointer-events:none;opacity:0;transition:opacity .25s;white-space:nowrap}
#complete{display:none;position:fixed;inset:0;background:#120b1be8;z-index:20;align-items:center;justify-content:center;padding:22px}
#complete .panel{background:#fff1d0;color:#4a2b36;border:5px solid #c99955;border-radius:22px;max-width:400px;width:100%;padding:24px;text-align:center}
#complete img{height:190px;max-width:80%;object-fit:contain}
#complete button{background:#b86b39;color:#fff;border:0;padding:14px 22px;border-radius:12px;font-size:17px;font-weight:800}
#complete .panel{position:relative;overflow:hidden;max-height:90dvh;overflow-y:auto}#chest{display:block;margin:8px auto 14px;border:0;background:transparent;cursor:pointer;font-size:110px;line-height:1.2;padding:0;filter:drop-shadow(0 0 15px #ffc85a);animation:chestPulse 1.2s infinite alternate}#chest img{display:block;width:min(68vw,270px);height:auto;max-height:235px;object-fit:contain}#chest.open{animation:chestOpen .9s ease-out forwards}#reward{display:none;animation:rewardPop .7s ease-out}#reward img{height:140px}#complete .sparkle{position:absolute;pointer-events:none;font-size:24px;animation:starFly 1.3s ease-out forwards}#complete .actions{display:flex;gap:9px;justify-content:center;flex-wrap:wrap}#complete .actions button{font-size:14px;padding:12px 15px}#complete .actions button.secondary{background:#6c5263}@keyframes chestPulse{to{transform:scale(1.07);filter:drop-shadow(0 0 28px #ffd66c)}}@keyframes chestOpen{40%{transform:scale(1.35) rotate(-8deg)}100%{transform:scale(.15);opacity:0}}@keyframes rewardPop{from{transform:scale(.5);opacity:0}to{transform:scale(1);opacity:1}}@keyframes starFly{from{transform:translate(0,0) scale(.4);opacity:1}to{transform:translate(var(--dx),var(--dy)) scale(1.8);opacity:0}}</style></head><body><header class="bar"><div><strong>🎭 코스튬 숍 · 숨은 물건 찾기</strong><small>한 손가락 이동 · 두 손가락 확대</small></div><button id="reset">전체 보기</button></header><section id="mission"><div><strong id="goal">숨은 물건 찾기</strong><small id="progress">0 / 8개 발견 · 확대해서 찾아보세요</small></div><button id="hint">💡 힌트 3</button></section><div id="view"><div id="world"></div><div id="toast"></div></div><div id="inventory" aria-label="찾아야 할 물건 8개"></div><footer id="bottom"><button id="minus">− 축소</button><span id="zoom">1.0×</span><button id="plus">+ 확대</button></footer><script>
const W=2141,H=734,world=document.querySelector('#world'),view=document.querySelector('#view'),zoomLabel=document.querySelector('#zoom');const xs=[0,535,1070,1606,2141],ys=[0,367,734];const cropX=[0,36,36,36],cropY=[0,36];for(let row=0;row<2;row++)for(let col=0;col<4;col++){const im=new Image();im.src=`costume_r${row+1}_c${col+1}.webp?v=2`;const coreW=xs[col+1]-xs[col],coreH=ys[row+1]-ys[row];const sourceW=[571,607,608,571][col],sourceH=403;const scaleX=coreW/(sourceW-(col===0?36:col===3?36:72));const scaleY=coreH/367;const imgW=sourceW*scaleX,imgH=sourceH*scaleY;const holder=document.createElement('div');holder.style.cssText=`position:absolute;overflow:hidden;left:${xs[col]}px;top:${ys[row]}px;width:${coreW}px;height:${coreH}px;pointer-events:none`;im.style.cssText=`position:absolute;max-width:none;width:${imgW}px;height:${imgH}px;left:${-cropX[col]*scaleX}px;top:${-cropY[row]*scaleY}px;object-fit:fill`;holder.append(im);world.append(holder)}
let s=1,min=1,x=0,y=0;const pointers=new Map();let prior=null;function constrain(){const rect=view.getBoundingClientRect();const ww=W*s,hh=H*s;x=ww<=rect.width?(rect.width-ww)/2:Math.min(0,Math.max(rect.width-ww,x));y=hh<=rect.height?(rect.height-hh)/2:Math.min(0,Math.max(rect.height-hh,y))}function render(){constrain();world.style.transform=`translate(${x}px,${y}px) scale(${s})`;zoomLabel.textContent=(s/min).toFixed(1)+'×'}function reset(){const r=view.getBoundingClientRect();min=Math.min(r.width/W,r.height/H);s=min;x=(r.width-W*s)/2;y=(r.height-H*s)/2;render()}function zoomTo(next,cx=view.clientWidth/2,cy=view.clientHeight/2){next=Math.min(min*6,Math.max(min,next));const ratio=next/s;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;s=next;render()}view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});prior=null});view.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;render()}else if(pointers.size===2){const [a,b]=[...pointers.values()];const dist=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2-view.getBoundingClientRect().left,cy=(a.y+b.y)/2-view.getBoundingClientRect().top;if(prior)zoomTo(s*dist/prior.dist,cx,cy);prior={dist}}});for(const name of ['pointerup','pointercancel','lostpointercapture'])view.addEventListener(name,e=>{pointers.delete(e.pointerId);prior=null});view.addEventListener('wheel',e=>{e.preventDefault();zoomTo(s*(e.deltaY<0?1.15:1/1.15),e.clientX-view.getBoundingClientRect().left,e.clientY-view.getBoundingClientRect().top)},{passive:false});document.querySelector('#reset').onclick=reset;document.querySelector('#plus').onclick=()=>zoomTo(s*1.5);document.querySelector('#minus').onclick=()=>zoomTo(s/1.5);window.addEventListener('resize',reset);reset();
</script><div id="complete"><div class="panel"><h2 id="finishTitle">🎁 황금 보물상자 발견!</h2><p id="chestInstruction">상자를 눌러 마지막 보상을 확인하세요!</p><button id="chest" aria-label="황금 보물상자 열기"><img src="a_vibrant_high_detail_fantasy_illustration_3d_ren.png" alt="마법의 황금 보물상자"></button><div id="reward"><div style="font-size:65px;filter:drop-shadow(0 0 15px gold)">🗝️</div><h2>✨ 황금 열쇠 획득! ✨</h2><img src="idle_front.webp" alt="윤슬이"><p>🎉 의상실 탈출 성공!<br>Congratulations! You found everything!</p><div class="actions"><button id="again">다시 도전하기</button><button id="finish" class="secondary">게임 종료</button></div></div></div></div><script>
(()=>{'use strict';
const world=document.getElementById('world'),view=document.getElementById('view');
const progress=document.getElementById('progress'),goal=document.getElementById('goal'),toast=document.getElementById('toast'),hint=document.getElementById('hint'),complete=document.getElementById('complete');
const items=[['01_hat.webp','hat','모자'],['02_crown.webp','crown','왕관'],['03_gloves.webp','gloves','장갑'],['04_boots.webp','boots','장화'],['05_mask.webp','mask','가면'],['06_wand.webp','wand','마법봉'],['07_potion.webp','potion','마법 물약'],['08_book.webp','book','마법책']];
let found=new Set(),hints=3,round=0,markers=[],toastTimer;const chest=document.getElementById('chest'),reward=document.getElementById('reward'),finishTitle=document.getElementById('finishTitle'),chestInstruction=document.getElementById('chestInstruction');const inventory=document.getElementById('inventory');inventory.innerHTML=items.map((it,i)=>`<div class="slot" id="slot-${i}"><img src="${it[0]}" alt="${it[2]}"><small>${it[1].toUpperCase()}</small></div>`).join('');
function place(){
 markers.forEach(e=>e.remove());markers=[];
 // Collectibles are separate game pieces; they do not claim to be original painted objects.
 const positions=[[.10,.18],[.38,.71],[.76,.24],[.89,.80],[.23,.48],[.57,.16],[.68,.65],[.43,.42]];
 const shift=round%3;
 items.forEach((it,i)=>{
  const e=document.createElement('div');e.className='find-object';const picture=document.createElement('img');picture.src=it[0];picture.alt=it[1];picture.style.cssText='width:100%;height:100%;object-fit:contain;pointer-events:none';e.append(picture);
  const p=positions[(i+shift)%positions.length];
  e.style.left=Math.round(p[0]*2141-22)+'px';e.style.top=Math.round(p[1]*734-22)+'px';
  e.title=it[1];e.setAttribute('aria-label',it[1]);
  e.addEventListener('pointerdown',ev=>ev.stopPropagation());
  e.addEventListener('click',ev=>{ev.stopPropagation();collect(i,e)});
  world.append(e);markers.push(e);
 });
 found.clear();hints=3;inventory.querySelectorAll('.slot').forEach(el=>el.classList.remove('acquired'));update();
}
function update(){progress.textContent=found.size+' / '+items.length+'개 발견 · 확대해서 찾아보세요';hint.textContent='💡 힌트 '+hints;
 const next=items.findIndex((_,i)=>!found.has(i));goal.textContent=next<0?'모든 물건을 찾았어요!':'찾을 물건: '+items[next][2]+' / '+items[next][1].toUpperCase();
}
function message(t){toast.textContent=t;toast.style.opacity='1';clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.style.opacity='0',1600)}
function collect(i,e){if(found.has(i))return;found.add(i);document.getElementById('slot-'+i).classList.add('acquired');e.classList.add('picked');setTimeout(()=>e.classList.add('found'),650);message('✨ '+items[i][1]+' · '+items[i][2]+' 발견!');update();if(found.size===items.length)setTimeout(()=>{complete.style.display='flex'},800)}
hint.addEventListener('click',()=>{if(hints<=0){message('힌트를 모두 사용했어요');return}const i=items.findIndex((_,i)=>!found.has(i));if(i<0)return;hints--;update();const el=markers[i];el.style.outline='5px solid #fff29a';el.style.borderRadius='50%';el.style.boxShadow='0 0 0 13px #ffe27988';setTimeout(()=>{el.style.outline='';el.style.boxShadow=''},2200);message('✨ 반짝이는 물건을 찾아보세요')});
chest.onclick=()=>{if(chest.classList.contains('open'))return;chest.classList.add('open');const panel=complete.querySelector('.panel');for(let i=0;i<24;i++){const star=document.createElement('span');star.className='sparkle';star.textContent=i%3?'✨':'⭐';star.style.left='50%';star.style.top='42%';star.style.setProperty('--dx',((i%8)-3.5)*55+'px');star.style.setProperty('--dy',(-180+Math.floor(i/8)*120)+'px');panel.append(star);setTimeout(()=>star.remove(),1400)}setTimeout(()=>{chest.style.display='none';chestInstruction.style.display='none';finishTitle.style.display='none';reward.style.display='block'},850)};document.getElementById('again').onclick=()=>{complete.style.display='none';chest.classList.remove('open');chest.style.display='block';chestInstruction.style.display='block';finishTitle.style.display='block';reward.style.display='none';round++;place()};document.getElementById('finish').onclick=()=>{complete.style.display='none';document.getElementById('goal').textContent='🎉 미션 완료 · 의상실 탈출 성공!';document.getElementById('progress').textContent='8 / 8개 발견 · 게임을 완료했습니다';document.getElementById('hint').style.display='none';document.getElementById('reset').textContent='다시 도전';document.getElementById('reset').onclick=()=>{location.reload()}};
place();
})();
</script></body></html>
