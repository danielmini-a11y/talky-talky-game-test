hint.onclick=()=>{if(quizActive||gameFinished)return;if(hints>0){revealHint();return}if(tickets>0){const q=hintQuestions[hintIndex++%hintQuestions.length];ask(q,'💡 힌트 획득 퀴즈',()=>{tickets--;hints++;message('🎉 힌트 1개 획득! 버튼을 눌러 사용하세요')});return}message('⏳ 4분마다 힌트 퀴즈 도전권이 생깁니다')};
chest.onclick=()=>{if(chest.classList.contains('open'))return;sfx('chest');chest.classList.add('open');const panel=complete.querySelector('.panel');for(let i=0;i<24;i++){const star=document.createElement('span');star.className='sparkle';star.textContent=i%3?'✨':'⭐';star.style.left='50%';star.style.top='42%';star.style.setProperty('--dx',((i%8)-3.5)*55+'px');star.style.setProperty('--dy',(-180+Math.floor(i/8)*120)+'px');panel.append(star);setTimeout(()=>star.remove(),1400)}setTimeout(()=>{chest.style.display='none';chestInstruction.style.display='none';finishTitle.style.display='none';reward.style.display='block';sfx('reward')},850)};
document.getElementById('again').onclick=()=>{complete.style.display='none';chest.classList.remove('open');chest.style.display='block';chestInstruction.style.display='block';finishTitle.style.display='block';reward.style.display='none';round++;place()};
document.getElementById('finish').onclick=()=>{try{localStorage.setItem('ttquest-costume','done')}catch(e){}location.href='./square.html?from=costume';return;complete.style.display='none';goal.textContent='🎉 미션 완료 · 의상실 탈출 성공!';progress.textContent='8 / 8개 발견 · 게임 완료';hint.style.display='none';document.getElementById('reset').textContent='다시 도전';document.getElementById('reset').onclick=()=>location.reload()};
place();
})();
</script><script>(function(){const p=new URLSearchParams(location.search),name=(p.get('student')||'').trim().slice(0,24),group=(p.get('group')||'').trim().slice(0,30);if(name||group){const el=document.querySelector('.bar small');if(el)el.textContent=[group,name].filter(Boolean).join(' · ')+' | 한 손가락 이동 · 두 손가락 확대';}})();</script></body></html>
