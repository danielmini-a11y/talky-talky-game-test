<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>토키토키 · 마을 광장</title><style>
*{box-sizing:border-box}body{margin:0;background:#100b2b;color:#fff1da;font-family:system-ui,'Noto Sans KR',sans-serif}main{max-width:760px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:10px}header h1{font-size:clamp(19px,5vw,27px)}a{color:#f8d68d}.stats{display:flex;justify-content:space-around;background:#291943;border:1px solid #9c75b5;border-radius:13px;padding:12px;font-weight:800;margin-bottom:12px}.stage{position:relative;overflow:hidden;height:min(69dvh,720px);min-height:410px;border:4px solid #b58b58;border-radius:24px;background:radial-gradient(circle at 50% 23%,#e2d0a7 0 4%,transparent 12%),linear-gradient(180deg,#101333 0%,#222657 42%,#40315b 60%,#6e5162 61%,#3b2a44 100%);box-shadow:inset 0 0 100px #090719} .moon{position:absolute;top:7%;left:45%;font-size:72px;filter:drop-shadow(0 0 26px #f9dc97)}.buildings{position:absolute;bottom:21%;width:100%;display:flex;justify-content:space-between;font-size:clamp(65px,19vw,130px);opacity:.85}.ground{position:absolute;bottom:0;width:100%;height:24%;background:repeating-linear-gradient(30deg,#55465a,#55465a 22px,#6c5268 23px,#6c5268 25px);border-top:7px solid #ae8266}.machine{position:absolute;top:30%;left:50%;transform:translateX(-50%);font-size:clamp(95px,25vw,170px);filter:drop-shadow(0 0 28px #b458ff);animation:pulse 2s infinite;cursor:pointer;user-select:none}.machine small{position:absolute;top:100%;left:50%;transform:translateX(-50%);font-size:14px;white-space:nowrap;background:#1d153ad9;padding:7px 13px;border-radius:12px}.clue{position:absolute;font-size:clamp(38px,10vw,65px);cursor:pointer;filter:drop-shadow(0 0 15px #ffe0a0);animation:float 2.4s ease-in-out infinite alternate;touch-action:manipulation}.clue:nth-of-type(even){animation-delay:-1.1s}.hint{position:absolute;top:12px;left:12px;right:12px;text-align:center;background:#160f36cb;border:1px solid #b58b58;border-radius:14px;padding:11px;font-weight:800}.overlay{position:fixed;inset:0;background:#050417dc;display:flex;align-items:center;justify-content:center;padding:16px;z-index:10}.overlay[hidden]{display:none}.panel{background:linear-gradient(#fff3d7,#f0d6a7);color:#402653;border:4px solid #bd915b;border-radius:27px;max-width:550px;width:100%;padding:24px 20px;text-align:center;box-shadow:0 20px 70px #0009}.panel h2{font-size:clamp(23px,6vw,32px)}.panel p{line-height:1.7;font-size:18px;font-weight:700}.panel button,.action{border:0;border-radius:15px;background:linear-gradient(110deg,#8655b0,#64358c);color:white;font-size:19px;font-weight:900;padding:16px 20px;width:100%;margin-top:10px;cursor:pointer}.choices button{background:#f7d08a;color:#38244b}.choices button:active{transform:scale(.98)}.guide{display:flex;gap:12px;align-items:center;text-align:left}.guide .avatar{font-size:78px}.feedback{min-height:24px;color:#663781;font-weight:900}@keyframes pulse{50%{filter:drop-shadow(0 0 40px #ff4bca) brightness(1.4)}}@keyframes float{to{transform:translateY(-15px) rotate(9deg)}}@media(max-height:700px){.stage{height:66dvh;min-height:370px}.panel{padding:15px}.panel p{font-size:16px}}</style></head><body><main><header><h1>🏘️ 토키토키 · 마을 광장</h1><a href="./index.html">미션 선택</a></header><div class="stats"><span id="count">🔎 단서 0/4</span><span id="status">⚙️ 장치 조사 중</span></div><section class="stage" id="stage"><div class="moon">🌕</div><div class="buildings">🏘️ 🏰 🏠</div><div class="ground"></div><div class="machine" id="machine" role="button" aria-label="수상한 장치 조사">⚙️<small>장치를 눌러 조사</small></div><div class="hint" id="hint">광장에 숨겨진 네 가지 증거를 찾아보세요!</div></section></main><div class="overlay" id="overlay"><div class="panel"><div id="body"><h2>🏘️ 마을 광장의 수수께끼</h2><div class="guide"><span class="avatar">🧑‍🔧</span><p>어서 와! 나는 광장 관리인 루카야. 도서관에서 가져온 단서가 이곳 장치와 연결된 것 같아. 광장을 조사하고 영어 암호를 풀어 보자!</p></div></div><button id="next">▶ 조사 시작</button></div></div><script>
(()=>{const $=id=>document.getElementById(id),stage=$('stage'),overlay=$('overlay'),body=$('body'),next=$('next');let found=new Set(),step=0;const clues=[{icon:'🔦',x:12,y:30,label:'빛',q:'What makes the strange shadow?',a:['A lamp and a mirror','A real ghost','A flying bird'],right:0,story:'수상한 그림자는 조명과 거울이 만들어 낸 환영이었어.'},{icon:'🪞',x:74,y:30,label:'거울',q:'Where is the mirror?',a:['Under the tree','Behind the machine','Inside the book'],right:1,story:'거울이 장치 뒤에 숨겨져 있었어.'},{icon:'🔊',x:15,y:65,label:'소리',q:'What can you hear?',a:['A strange sound','A sweet song','A barking dog'],right:0,story:'숲에서 들리던 소리는 이 장치의 스피커에서 나왔어.'},{icon:'⏰',x:76,y:65,label:'시계',q:'When does the machine start?',a:['At noon','At midnight','In the morning'],right:1,story:'이 장치는 자정이 되면 자동으로 작동하도록 설정돼 있어.'}];function speak(t){if(!('speechSynthesis'in window))return;speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang=/[가-힣]/.test(t)?'ko-KR':'en-US';u.rate=.91;speechSynthesis.speak(u)}function show(html,btn,cb){body.innerHTML=html;next.textContent=btn;next.onclick=cb;overlay.hidden=false}function hide(){overlay.hidden=true}function render(){stage.querySelectorAll('.clue').forEach(n=>n.remove());clues.forEach((c,i)=>{if(found.has(i))return;let n=document.createElement('div');n.className='clue';n.textContent=c.icon;n.style.left=c.x+'%';n.style.top=c.y+'%';n.setAttribute('role','button');n.setAttribute('aria-label',c.label+' 단서');n.onclick=()=>ask(i);stage.append(n)});$('count').textContent='🔎 단서 '+found.size+'/4';$('hint').textContent=found.size===4?'증거를 모두 모았어! 중앙 장치를 눌러 봐.':'광장에 숨겨진 네 가지 증거를 찾아보세요!'}function ask(i){const c=clues[i];let html='<h2>'+c.icon+' '+c.label+' 단서</h2><p>'+c.q+'</p><button class="action" id="listen">🔊 영어 듣기</button><div class="choices">'+c.a.map((v,j)=>'<button data-choice="'+j+'">'+v+'</button>').join('')+'</div><p class="feedback" id="feedback"></p>';show(html,'← 광장으로 돌아가기',hide);$('listen').onclick=()=>speak(c.q);document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>{if(+b.dataset.choice!==c.right){$('feedback').textContent='다시 생각해 보자!';return}found.add(i);render();show('<h2>✨ 단서 발견!</h2><p>'+c.story+'</p>','▶ 계속 조사하기',hide);speak('잘했어! '+c.story)})}function machine(){if(found.size<4){show('<h2>⚙️ 장치가 잠겨 있어!</h2><p>광장에 숨겨진 단서 '+(4-found.size)+'개를 더 찾아야 해.</p>','▶ 돌아가기',hide);return}show('<h2>⚙️ 마지막 암호</h2><p>What time does the machine turn on?</p><div class="choices"><button data-final="0">At noon</button><button data-final="1">At midnight</button><button data-final="2">At sunrise</button></div><p id="feedback" class="feedback"></p>','🔊 문제 듣기',()=>speak('What time does the machine turn on?'));document.querySelectorAll('[data-final]').forEach(b=>b.onclick=()=>{if(b.dataset.final!=='1'){$('feedback').textContent='다시 도전해 봐!';return}localStorage.setItem('tokitoki-halloween-square-complete','1');$('status').textContent='🏆 광장 조사 완료';show('<h2>🏆 마을 광장 조사 완료!</h2><p>장치는 자정에 빛과 소리를 내도록 만들어진 기계였어. 진짜 유령이 아니었다는 사실을 확인했어!</p><p>다음 이야기의 문이 열릴 준비가 되었어.</p>','▶ 미션 선택으로',()=>(localStorage.setItem('ttquest-square','done'),location.href='./map.html?finished=1'));speak('정말 잘했어! 수상한 장치의 정체를 밝혀냈구나!')})}next.onclick=()=>{hide();speak('광장을 조사하고 영어 암호를 풀어 보자!')};$('machine').onclick=machine;render()})();
</script></body></html>
