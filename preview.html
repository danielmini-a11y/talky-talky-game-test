<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>코스튬 숍 탐색 시제품</title><style>*{box-sizing:border-box}body{margin:0;background:#1a1020;color:#fff;font-family:system-ui,sans-serif;overflow:hidden}.bar{height:64px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:#271a30;gap:8px}.bar strong{font-size:15px}.bar small{display:block;color:#e7c99c;font-size:11px}.bar button{background:#f3c577;border:0;border-radius:12px;padding:10px;font-weight:800}#view{position:relative;width:100vw;height:calc(100dvh - 122px);overflow:hidden;touch-action:none;cursor:grab;background:#0c0811}#world{position:absolute;left:0;top:0;width:2141px;height:734px;transform-origin:0 0;will-change:transform}#world img{position:absolute;display:block;user-select:none;pointer-events:none}#bottom{height:58px;display:flex;align-items:center;justify-content:space-around;background:#271a30;font-size:13px}#bottom button{border:1px solid #ba8a55;border-radius:10px;padding:8px 12px;background:#4b3049;color:#fff}#zoom{font-weight:800;color:#ffd78c}</style></head><body><header class="bar"><div><strong>🎭 코스튬 숍 · 탐색 테스트</strong><small>한 손가락 이동 · 두 손가락 확대</small></div><button id="reset">전체 보기</button></header><div id="view"><div id="world"></div></div><footer id="bottom"><button id="minus">− 축소</button><span id="zoom">1.0×</span><button id="plus">+ 확대</button></footer><script>
const W=2141,H=734,world=document.querySelector('#world'),view=document.querySelector('#view'),zoomLabel=document.querySelector('#zoom');const xs=[0,535,1070,1606,2141],ys=[0,367,734];for(let row=0;row<2;row++)for(let col=0;col<4;col++){const im=new Image();im.src=`costume_r${row+1}_c${col+1}.webp`;im.style.left=xs[col]+'px';im.style.top=ys[row]+'px';im.style.width=(xs[col+1]-xs[col])+'px';im.style.height=(ys[row+1]-ys[row])+'px';im.style.objectFit='cover';world.append(im)}
let s=1,min=1,x=0,y=0;const pointers=new Map();let prior=null;function constrain(){const rect=view.getBoundingClientRect();const ww=W*s,hh=H*s;x=ww<=rect.width?(rect.width-ww)/2:Math.min(0,Math.max(rect.width-ww,x));y=hh<=rect.height?(rect.height-hh)/2:Math.min(0,Math.max(rect.height-hh,y))}function render(){constrain();world.style.transform=`translate(${x}px,${y}px) scale(${s})`;zoomLabel.textContent=(s/min).toFixed(1)+'×'}function reset(){const r=view.getBoundingClientRect();min=Math.min(r.width/W,r.height/H);s=min;x=(r.width-W*s)/2;y=(r.height-H*s)/2;render()}function zoomTo(next,cx=view.clientWidth/2,cy=view.clientHeight/2){next=Math.min(min*6,Math.max(min,next));const ratio=next/s;x=cx-(cx-x)*ratio;y=cy-(cy-y)*ratio;s=next;render()}view.addEventListener('pointerdown',e=>{view.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});prior=null});view.addEventListener('pointermove',e=>{if(!pointers.has(e.pointerId))return;const prev=pointers.get(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});if(pointers.size===1){x+=e.clientX-prev.x;y+=e.clientY-prev.y;render()}else if(pointers.size===2){const [a,b]=[...pointers.values()];const dist=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2-view.getBoundingClientRect().left,cy=(a.y+b.y)/2-view.getBoundingClientRect().top;if(prior)zoomTo(s*dist/prior.dist,cx,cy);prior={dist}}});for(const name of ['pointerup','pointercancel','lostpointercapture'])view.addEventListener(name,e=>{pointers.delete(e.pointerId);prior=null});view.addEventListener('wheel',e=>{e.preventDefault();zoomTo(s*(e.deltaY<0?1.15:1/1.15),e.clientX-view.getBoundingClientRect().left,e.clientY-view.getBoundingClientRect().top)},{passive:false});document.querySelector('#reset').onclick=reset;document.querySelector('#plus').onclick=()=>zoomTo(s*1.5);document.querySelector('#minus').onclick=()=>zoomTo(s/1.5);window.addEventListener('resize',reset);reset();
</script></body></html>
